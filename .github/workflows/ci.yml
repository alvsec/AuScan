name: CI

on:
  # Todas las ramas, no solo main: SECURITY.md promete que la regla de
  # datos sintéticos se comprueba en cada push, y una promesa que solo
  # se cumple al fusionar llega tarde. branches-ignore evita que una rama
  # con PR abierta dispare la matriz completa dos veces por el mismo commit.
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Comprobaciones
        run: npm run check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Formato de Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build
        run: npm run build && cargo build --manifest-path src-tauri/Cargo.toml
