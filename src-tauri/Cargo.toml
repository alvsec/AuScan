[package]
name = "auscan"
version = "0.1.0"
description = "Recolección para auditorías de seguridad de red autorizadas"
authors = ["nonnamme"]
edition = "2021"
# `gen-fixtures` (abajo) es un segundo binario del mismo paquete; sin esto
# `cargo run` -- que es lo que invoca `tauri dev` por debajo -- no sabe
# cuál de los dos lanzar y falla en vez de arrancar la app.
default-run = "auscan"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "auscan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
time = { version = "0.3.55", features = ["formatting"] }
ipnet = { version = "2.12.1", features = ["serde"] }
semver = "1.0.28"
which = "8.0.5"
roxmltree = "0.20"
regex = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
tokio-util = "0.7"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
walkdir = "2.5.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[[bin]]
name = "gen-fixtures"
path = "../tools/gen-fixtures/main.rs"
